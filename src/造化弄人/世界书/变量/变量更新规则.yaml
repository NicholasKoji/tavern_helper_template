---
变量更新规则:
  当前场景:
    地点:
      check:
        - 开场生成或场景转换时更新为具体地点
    时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 剧情推进、休息、旅行后按合理时间流逝更新
    摘要:
      check:
        - 用一句话记录当前场景最值得注意的事态
  世界配置:
    世界模板:
      check:
        - 仅在玩家通过世界配置界面重新配置时更新，AI 不得擅自修改
    世界观描述:
      check:
        - 反映玩家配置的世界背景；AI 补充细节时保持与配置一致
    基调.${色情浓度|搞笑程度|轻松程度}:
      type: number
      range: 0~100
      check:
        - 仅在玩家重新配置时更新
    允许黑深残:
      type: boolean
      check:
        - 为 false 时禁止把剧情引向苦大仇深方向
    允许抽风:
      type: boolean
      check:
        - 为 false 时现实编辑器不得自主抽风
    抽风频率:
      check:
        - 低：每 5~8 楼可能抽风一次；中：每 3~5 楼；高：每 1~2 楼；随心所欲：由剧情自然决定
    主角补充设定:
      check:
        - 玩家在配置界面填写的补充设定，AI 应遵守
    常识规则:
      type: |-
        {
          [规则名: string]: string; // 规则内容
        }
      check:
        - 玩家配置后写入；AI 不得擅自修改，除非现实编辑器抽风或玩家主动要求
    行为习惯:
      type: |-
        {
          [习惯名: string]: string; // 习惯内容
        }
      check:
        - 玩家配置后写入；AI 不得擅自修改，除非现实编辑器抽风或玩家主动要求
    物理规则:
      type: |-
        {
          [规则名: string]: string; // 规则内容
        }
      check:
        - 玩家配置后写入；AI 不得擅自修改，除非现实编辑器抽风或玩家主动要求
    创建时间:
      check:
        - 配置界面写入，之后不再修改
  现实编辑器:
    状态:
      check:
        - 在正常、抽风中、维护中、待机之间按剧情切换
        - 抽风结束后恢复为正常
    版本:
      check:
        - 抽风时可顺带更新版本号（如 v0.1.1-alpha），增加荒诞感
    权限.修改世界规则:
      type: boolean
      check:
        - 只读，始终为 true，禁止修改
    权限.修改自身权限:
      type: boolean
      check:
        - 只读，始终为 false，禁止修改
    权限.卸载本设备:
      type: boolean
      check:
        - 只读，始终为 false，禁止修改
    生效规则:
      type: |-
        {
          [类别: string]: {
            [规则名: string]: string; // 规则内容
          }
        }
      check:
        - 玩家配置或现实编辑器修改/抽风后，将当前真正生效的规则同步到这里
        - 每轮回复检查生效规则是否与剧情表现一致
    抽风记录:
      type: |-
        {
          [记录名: string]: {
            时间: string;
            改动: string;
            结果: string;
            是否被主角发现: boolean;
          }
        }
      check:
        - 现实编辑器每次自主抽风或玩家修改规则时追加一条记录
        - 记录内容要具体，能作为后续剧情的伏笔
        - 最多保留最近 20 条，超出时移除最早的
    下次抽风提示:
      check:
        - 在剧情中给出模糊的“系统预告”，如“将在 3 次心跳后执行计划维护”
  主角:
    姓名:
      check:
        - 玩家在酒馆人设中设置了名字时通过 <user> 宏体现，不强制写入
    身份:
      check:
        - 世界配置确定后按模板更新主角身份
    补充设定:
      check:
        - 与配置界面的主角补充设定保持一致
  NPC序列:
    type: |-
      {
        [NPC名称: string]: {
          基础信息: {
            姓名: string;
            性别: string;
            年龄: string;
            身份: string;
            与主角关系: string;
          };
          当前想法: string;
        }
      }
    check:
      - 新 NPC 出现时建档，离开场景后保留，方便回归
      - 当前想法用该 NPC 第一人称视角书写
