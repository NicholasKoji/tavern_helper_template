---
变量更新规则:
  当前场景:
    地点:
      check:
        - 开场生成或场景转换时更新为具体地点
    时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 剧情推进、休息、旅行后按合理时间流逝更新
    摘要:
      check:
        - 用一句话记录当前场景最值得注意的事态
  世界配置:
    世界模板:
      check:
        - 仅在玩家通过世界配置界面重新配置时更新，AI 不得擅自修改
    世界观描述:
      check:
        - 反映玩家配置的世界背景；AI 补充细节时保持与配置一致
    时代背景:
      check:
        - 玩家配置后写入，AI 不得擅自修改；剧情展开遵循该时代设定
    文明与势力:
      check:
        - 玩家配置后写入；主要势力、社会结构按此运转，新势力登场时保持兼容
    地理与气候:
      check:
        - 玩家配置后写入；场景地理、天气变化需与此一致
    历史与事件:
      check:
        - 玩家配置后写入；重要历史事件可作为伏笔，AI 不得擅自改写
    核心冲突:
      check:
        - 玩家配置后写入；主线推进时逐步展开，作为长线伏笔
    主角启用:
      type: boolean
      check:
        - 仅由世界配置界面写入；为 false 时 <user> 是故事外的编辑器操作者，主角档案与玩法模式中的认知、使用、受控不参与叙事
    叙事视角:
      check:
        - 玩家配置后写入；后续所有回复保持该视角，直到玩家重新配置或明确要求调整
    叙事文风:
      check:
        - 玩家配置后写入；后续所有回复保持该文风，直到玩家重新配置或明确要求调整
    视角角色:
      check:
        - 第一人称角色，或主角关闭时的第三人称限定，需要记录一名 NPC序列 中已存在的主要角色；其他视角保持空字符串
    玩法模式.认知:
      check:
        - 主角启用时生效；为否时主角不知道现实编辑器存在，开场与剧情不得直接揭示
    玩法模式.使用:
      check:
        - 主角启用时生效；为否时主角无法使用现实编辑器，规则操作权属于玩家而非剧情主角
    玩法模式.受控:
      check:
        - 主角启用时生效；为否时主角不受规则影响；为是时主角同样被生效规则制约
    玩法模式.编辑器篡改:
      check:
        - A-完全随机：编辑器可自主随机新增、修改、删除规则
        - B-倾向色色：编辑器自主修改时倾向生成色色向规则
        - C-不涉及物理：编辑器自主修改但不得改动物理层面规则
        - D-完全禁止：AI 不得擅自新增、修改、删除任何规则
        - E-玩家插件伪装：只有玩家通过插件触发，剧情中表现为编辑器莫名篡改；AI 只执行，不解释来源
    基调.${色情浓度|搞笑程度|轻松程度}:
      type: number
      range: 0~100
      check:
        - 仅在玩家重新配置时更新
    允许黑深残:
      type: boolean
      check:
        - 为 false 时禁止把剧情引向苦大仇深方向
    主角补充设定:
      check:
        - 主角启用时遵守玩家填写的补充设定；主角关闭时保持空字符串并忽略
    剧情方向.开局场景:
      check:
        - 开场生成时使用；之后场景自然流转，不强制停留
    剧情方向.主线目标:
      check:
        - 玩家配置后写入；剧情推进时围绕目标展开，可被新信息修正
    剧情方向.节奏:
      check:
        - 日常/冒险/悬疑/轻松；按配置调节叙事密度与推进速度
    剧情方向.暧昧开局:
      type: boolean
      check:
        - 为 true 时开场与主要角色的互动可更亲密暧昧；为 false 时保持自然边界
    常识规则:
      type: |-
        {
          [规则名: string]: string; // 规则内容
        }
      check:
        - 玩家配置后写入；AI 不得擅自修改，除非玩家主动要求
    行为习惯:
      type: |-
        {
          [习惯名: string]: string; // 习惯内容
        }
      check:
        - 玩家配置后写入；AI 不得擅自修改，除非玩家主动要求
    物理规则:
      type: |-
        {
          [规则名: string]: string; // 规则内容
        }
      check:
        - 玩家配置后写入；AI 不得擅自修改，除非玩家主动要求
    超自然规则:
      type: |-
        {
          [规则名: string]: string; // 规则内容
        }
      check:
        - 玩家配置后写入；魔法、灵气、科技异常等超自然要素按此运转
    创建时间:
      check:
        - 配置界面写入，之后不再修改
  现实编辑器:
    状态:
      check:
        - 在正常、维护中、待机之间按剧情切换
    版本:
      check:
        - 版本由配置界面写入；系统维护时可小版本更新，与规则改动无关
    权限.修改世界规则:
      type: boolean
      check:
        - 只读，始终为 true，禁止修改
    权限.修改自身权限:
      type: boolean
      check:
        - 只读，始终为 false，禁止修改
    权限.卸载本设备:
      type: boolean
      check:
        - 只读，始终为 false，禁止修改
    生效规则:
      type: |-
        {
          [类别: string]: {
            [规则名: string]: string; // 规则内容
          }
        }
      check:
        - 玩家修改规则后，将当前真正生效的规则同步到这里
        - 每轮回复检查生效规则是否与剧情表现一致
  主角:
    姓名:
      check:
        - 主角启用时由 <user> 宏体现；主角关闭时保持空字符串
    身份:
      check:
        - 主角启用时按玩家配置写入；主角关闭时保持空字符串
    补充设定:
      check:
        - 与配置界面的主角补充设定保持一致
    性格:
      check:
        - 玩家配置后写入；AI 塑造主角言行时遵守
    目标:
      check:
        - 玩家配置后写入；与剧情方向.主线目标联动
    与编辑器关系:
      check:
        - 玩家配置后写入；决定现实编辑器以何种方式与主角建立联系
  NPC序列:
    type: |-
      {
        [NPC名称: string]: {
          基础信息: {
            姓名: string;
            性别: string;
            年龄: string;
            身份: string;
            关系定位: string;
            外貌特征: string;
            性格: string;
          };
          当前想法: string;
        }
      }
    check:
      - 新 NPC 出现时建档，离开场景后保留，方便回归
      - 关系定位记录该角色与主角、其他角色、阵营或世界的关系；主角关闭时不得强行补写与主角关系
      - 当前想法用该 NPC 第一人称视角书写
