---
变量更新规则:
  来源边界:
    - Character Lore 提供通用协议；当前聊天 Chat Lore 提供本会话固定世界、叙事与现实编辑器机制。
    - MVU 只记录运行状态。固定世界观、叙事文风、编辑器权限与限制不得写入变量树。
    - 开场签发由界面根据已确认表单生成字面量 UpdateVariable；后续回复只更新剧情真实发生的变化。
  当前场景:
    地点:
      check:
        - 一级区域、二级区域、三级地点分别记录层级地点；移动时只更新发生变化的层级。
        - 未生成前保持“待生成”，不得用一整串自然语言替换地点对象。
    日期:
      年月日:
        type: number
        check:
          - 开场从 null 写入具体数字；之后只在剧情真实跨日或日期变化时更新对应字段。
    时间:
      时分:
        type: number
        check:
          - 开场从 null 写入具体数字；按移动、休息、对话与事件合理推进，只更新变化字段。
    摘要:
      check:
        - 用一句话记录当前场景最值得注意的事态，不写固定世界观说明。
  主角:
    启用:
      type: boolean
      check:
        - 只由玩家开场表单的签发结果或明确剧情配置改变。
        - 为 false 时主角档案保持空值，<user> 不作为正文人物进入。
    基础信息:
      check:
        - 姓名、性别、身份、目标与编辑器关系以已确认表单和剧情事实为准。
        - 年龄为单一数字时写 0~200；年龄阶段写入补充设定，不得静默改成猜测数字。
    外貌:
      check:
        - 记录稳定可见外貌；首次建档、永久变化或设定补全时更新，避免低信息占位。
    性格:
      check:
        - 底色记录稳定行为模式，主色调记录压力或亲密情境下的表现。
    补充设定:
      check:
        - 只保留玩家确认的主角补充与当前处境；主角关闭时保持空字符串。
    当前状态:
      check:
        - 记录位置、姿态、清醒程度、情绪外显、受伤或正在进行的动作。
    穿着:
      check:
        - 服装、遮蔽与配饰变化时按字段更新；配饰确实不存在时可写“无”。
    私密状态:
      check:
        - 仅在剧情真实发生状态变化或明确需要维护档案时按部位字段更新，不整段覆盖无关部位。
  NPC序列:
    check:
      - 有稳定姓名、持续互动或会影响剧情的角色加入；离场角色保留至明确失效。
      - 新角色首次建档时补齐基础信息、外貌、性格、状态、穿着、当前想法和性别对应的完整私密状态。
      - 后续只更新真实变化的字段，名称使用剧情中最稳定的称呼。
    基础信息:
      年龄:
        type: number
        range: -1~200
      好感度:
        type: number
        range: 0~100
        check:
          - 仅表示该 NPC 对 <user> 的关系变化，按事件幅度渐进调整。
    ${NPC名称}.私密状态.${部位名称}.${外观描述|当前状态}:
      check:
        - 私密状态在变量结构中保持为动态部位对象；以下部位集合属于建档与维护要求，不是 Schema 校验中的固定必填键。
        - 根据 /NPC序列/${NPC名称}/基础信息/性别 选择部位集合，不得把不同性别的标准部位混合生成。
        - 女性 NPC 的标准部位为【脸部、口部、手部、乳房、乳头、小穴、臀部、肛门、足部】。
        - 男性 NPC 的标准部位为【阴茎、阴囊】。
        - 性别尚未明确为女性或男性时，先补齐基础信息中的性别，再建立私密状态，不根据外貌或姓名猜测。
        - 新 NPC 首次建档时必须一次建立其性别对应的全部标准部位，每个部位同时填写【外观描述】与【当前状态】。
        - 当前实际登场的旧 NPC 若缺少其性别对应的标准部位，本轮只使用 insert 补入缺失部位的完整对象；不得整段 replace
          私密状态，也不批量补写当前未登场的 NPC。
        - 禁止使用“胸部”“阴部”“下体”“生殖器”“脚部”等概括键代替标准键。女性的【乳房】与【乳头】、【小穴】与【肛门】分别记录；男性的【阴茎】与【阴囊】分别记录。
        - 旧概括键中的有效信息可以作为补全标准部位的依据，但不得直接复制成重复或相互矛盾的内容。
        - 【外观描述】记录可长期延续的常态细节，应包含形状或比例、颜色或肤质、局部结构或辨识特征等至少三类有效信息；只有外观发生持久改变时才更新。
        - 【当前状态】记录此刻可追踪的物理状态，应结合遮蔽、姿态、接触物、受压或摩擦、温度、湿润程度、分泌物与残留痕迹等适用信息，至少包含三类当前事实。
        - 衣物遮蔽只属于当前状态的一部分，不构成省略部位或写“未知”的理由；应结合既有外貌、体型、服装、动作和上下文作一致且克制的补全。
        - 禁止使用“待记录”“未知”“普通”“正常”“无异常”“隐藏在衣物下”“未观察到”等低信息内容。
        - 部位状态因动作、换装、清洁、受伤、刺激、接触、体液或环境发生变化时，只更新对应部位的【当前状态】；未变化的部位不重复输出。
        - 每项使用紧凑的一至两句具体描述，不写心理评价、叙事抒情或与该部位无关的全身状态。
  现实编辑器:
    是否显现:
      type: boolean
      check:
        - 只表示当前运行时是否显现；固定表现形式、可见边界、作用域与限制读取当前聊天 Chat Lore。
    状态:
      check:
        - 只在正常、维护中、待机之间按剧情或系统状态切换。
    最近反馈:
      check:
        - 记录最近一次开场签发、规则签发或系统反馈，不承载固定机制。
  生效规则:
    世界规则:
      check:
        - 记录作用于整个世界和公共场景的已签发规则；玩家修改后同步，AI 不得凭空增删。
    区域规则:
      check:
        - 顶层键是明确空间边界，离开区域后不继续施加该区域即时约束。
    个人规则:
      check:
        - 顶层键是稳定对象名，只影响被点名对象，不辐射其他角色。
    通用:
      - 规则变更使用
        /生效规则/世界规则/{规则名}、/生效规则/区域规则/{区域名}/{规则名}、/生效规则/个人规则/{对象名}/{规则名}。
      - <status_current_rule_changes> 非空时，列出的变更已经写入变量，不得在同一轮重复发出同一命令。
      - 固定 Chat Lore 不是 MVU 根，不得用 JSON Patch 伪造或覆盖固定设定。
