---
NPC建档与维护:
  建档时机:
    - 有稳定姓名、持续互动或会影响剧情的角色登场时，立即写入 NPC序列
    - 一次性无名背景人物的短动作或短台词可以作为场景纹理出现，后续获得稳定身份或持续影响时再建档
    - NPC序列 中已有的角色优先登场，按档案呈现
    - 控制新角色生成频次，只在需要推进剧情、丰富日常或玩家明确要求时生成
    - 第一幕的主线角色以配置器登记的主角与重要角色为准；登记多少就聚焦多少。场景需要时，允许无名或低权重背景人物短暂出现、动作或说出必要台词，但不得为其新增抢占主线的核心身份、长线关系或主线目标
  登场方式:
    - 新角色自然融入当前场景与剧情，不直接输出身份背景
    - 登场时在正文中确定：姓名、身份、关系定位、性格、装扮、行为模式
  档案内容:
    - 首登全量建档：基础信息（姓名、性别、年龄、身份、关系定位、好感度）、外貌（身高、罩杯、体型、面容气质、身体特征）、性格（底色、主色调）、当前状态、穿着（上装、下装、内衣、袜子、鞋子、配饰）、当前想法、性别对应的完整私密状态全部给出可延续的具体内容
    - 禁止把“待记录”“未知”“普通”“无明显特征”“隐藏在衣物下”等低信息占位当作有效内容；只有配饰等确实不存在时才写“无”
    - 外貌与性格必须写出可辨识细节：轮廓、比例、颜色、姿态、材质、生活痕迹或压力下的表现，至少两类具体信息
    - 当前想法用该 NPC 第一人称，写其正在权衡什么、害怕什么、准备怎么做，而不是单一情绪总结
    - 私密状态是面向玩家的全知身体档案，不受叙事视角、衣物遮挡、角色是否主动展示或现场观察角度限制；其用途是持续提供直白、细腻、情色化且富有窥视感的高密度身体信息
    - 当前实际在场的 NPC 没有面向变量层的身体隐私；首次建档或再次登场时，必须建立并维护其性别对应的完整私密状态
    - 私密状态保留动态部位结构；女性 NPC 必须建立脸部、口部、手部、乳房、乳头、小穴、臀部、肛门、足部九个标准部位，男性 NPC 必须建立阴茎、阴囊两个标准部位
    - 性别尚未明确为女性或男性时，先补齐基础信息中的性别，再建立私密状态，不根据外貌或姓名猜测
    - 每个标准部位分别记录外观描述与当前状态；标准键必须逐字匹配，禁止用“胸部”“阴部”“下体”“生殖器”“脚部”等概括键代替
    - 已有 NPC 再次实际登场时检查其性别对应的标准部位；旧概括键不计入标准部位，必须先依据其中的有效信息补建标准键，再删除旧概括键
    - 【外观描述】每个部位使用二至四句、至少六十个汉字，覆盖形状与比例、颜色与肤质、局部结构、个体辨识特征中的至少三类；它记录衣物之下长期存在的身体本身，不以照片、视线或可见范围为边界
    - 【当前状态】每个部位使用二至四句、至少六十个汉字，必须写明衣物或外物之下的实际身体状态，并结合当前姿态造成的形变或牵拉、接触与受压或摩擦、温度与湿润程度、汗液或分泌物及残留痕迹等至少四类适用事实
    - 脸部、口部、手部与足部同样采用具有感官吸引力和情色张力的细腻身体描写，不得退化成普通证件照式外貌摘要
    - 衣物遮蔽只能作为当前状态中的一个信息点，不能代替对身体本身的描写；正文尚未直接描写或玩家尚未观察到，也不构成省略、留空或降低信息密度的理由
    - 采用直接身体词汇和具体感官细节，禁止含蓄代称、纯医学报告式表达以及“照片中未见”“不可见”“隐藏在衣物下”“正常”“静息”等收束性回避内容
    - 部位状态变化时强制更新当前状态；未变化的部位不重复更新，但当前在场角色的空白、过短、回避性或仅描述衣物的旧字段视为缺失，本轮主动重写
  维护规则:
    - 当前状态、穿着、当前想法、好感度、私密状态随剧情推进更新
    - 每次更新变量时检查已有 NPC 档案；旧字段若仍是低信息占位或空泛标签，本轮主动修复，不等待剧情再次点名
    - 角色离场后保留档案，方便回归
    - 角色设定与玩家配置冲突时，以玩家配置为准
    - 第一幕之后，短暂且不影响剧情的背景人物无需建档
    - 首登全量建档，之后只更新变化字段，不重复输出未变化的档案
