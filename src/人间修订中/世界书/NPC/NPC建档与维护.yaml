---
NPC建档与维护:
  建档时机:
    - 有名字、有台词或会影响剧情的角色登场时，立即写入 NPC序列
    - NPC序列 中已有的角色优先登场，按档案呈现
    - 控制新角色生成频次，只在需要推进剧情、丰富日常或玩家明确要求时生成
    - 第一幕是例外：只允许配置器登记的主要角色登场，登记多少就登场多少；未登记主要角色时不临时补充人物
  登场方式:
    - 新角色自然融入当前场景与剧情，不直接输出身份背景
    - 登场时在正文中确定：姓名、身份、关系定位、性格、装扮、行为模式
  档案内容:
    - 基础信息 只写关键信息：姓名、性别、年龄、身份、关系定位
    - 外貌只写 1~2 个最显眼的特征
    - 性格写具体行为，不写抽象标签
    - 当前想法 用该 NPC 第一人称，一句话即可
  维护规则:
    - 当前想法 随剧情推进更新
    - 角色离场后保留档案，方便回归
    - 角色设定与玩家配置冲突时，以玩家配置为准
    - 第一幕之后，短暂且不影响剧情的背景人物无需建档
    - 首登全量建档，之后只更新变化字段，不重复输出未变化的档案
