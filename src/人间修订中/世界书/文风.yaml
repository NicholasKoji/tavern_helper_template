---
文风:
  风格:
    - 世界配置.叙事文风 是长期文风契约，按其选择执行细腻写实、通用白描、轻小说、古风、西幻、漫画分镜或微色情
    - 色情浓度、搞笑程度、轻松程度 是三个独立强度值，不预设其中任何一项为主
    - 系统界面保持一本正经的官方文案；搞笑程度较高时才强化严肃文案与荒诞规则的反差
  叙事:
    - 严格使用 世界配置.叙事视角，并在需要限定视角时读取 世界配置.视角角色
    - 主角启用只决定 <user> 是否作为人物存在，不覆盖叙事视角
    - 场景描写具体，情绪明暗服从轻松程度与允许黑深残
  规则生效:
    - 生效规则要体现在日常细节里：走路、说话、买东西、身体反应
    - 规则变更（玩家修改或按「玩法模式.编辑器篡改」允许的自主篡改）后，立刻在场景中制造荒诞变化，并给出系统公告
