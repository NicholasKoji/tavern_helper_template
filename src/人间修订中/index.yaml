    - 正则名称: '[界面]状态栏'
      id: b50d0bed-ff40-4a25-9ada-14feb4283324
      启用: true
      查找表达式: <StatusPlaceHolderImpl/>
      替换为: |-
        ```
        <body>
        <script>
        const get_human_revision_pages_url = () => {
          try {
            const value = globalThis.__HUMAN_REVISION_PAGES_BASE_URL__;
            if (typeof value !== 'string' || !value.trim()) return '';
            const url = new URL(value.trim());
            return url.protocol === 'https:' ? url.href.replace(/\/+$/, '') : '';
          } catch {
            return '';
          }
        };
        const human_revision_pages_url = get_human_revision_pages_url();
        const status_bar_revision = 'human-revision-status-v2';
        const status_bar_urls = [
          ...(human_revision_pages_url ? [`${human_revision_pages_url}/human-revision/status/index.html`] : []),
          'https://cdn.jsdelivr.net/gh/NicholasKoji/tavern_helper_template@codex/zaohua-nongren/dist/人间修订中/界面/状态栏/index.html',
          'https://raw.githubusercontent.com/NicholasKoji/tavern_helper_template/codex/zaohua-nongren/dist/人间修订中/界面/状态栏/index.html',
        ];
        const mount_remote_html = html => {
          const parsed = new DOMParser().parseFromString(html, 'text/html');
          for (const node of parsed.head.querySelectorAll('style, link[rel="stylesheet"]')) {
            document.head.appendChild(document.importNode(node, true));
          }
          const scripts = [...parsed.querySelectorAll('script')];
          for (const script of scripts) script.remove();
          document.body.replaceChildren(...[...parsed.body.childNodes].map(node => document.importNode(node, true)));
          for (const source of scripts) {
            const script = document.createElement('script');
            for (const { name, value } of [...source.attributes]) script.setAttribute(name, value);
            script.textContent = source.textContent;
            document.body.appendChild(script);
          }
        };
        const load_status_bar = async () => {
          for (const source of status_bar_urls) {
            try {
              const separator = source.includes('?') ? '&' : '?';
              const url = encodeURI(`${source}${separator}revision=${status_bar_revision}`);
              const response = await fetch(url, { cache: 'no-store', headers: { Accept: 'text/html' } });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const html = await response.text();
              if (!html.includes(status_bar_revision)) throw new Error('revision mismatch');
              mount_remote_html(html);
              return;
            } catch (error) {
              console.warn('[人间修订中] 状态栏前端加载回退', source, error);
            }
          }
          document.body.textContent = '状态栏加载失败，请稍后重试';
        };
        void load_status_bar();
        </script>
        </body>
        ```
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

